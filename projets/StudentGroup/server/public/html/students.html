<!DOCTYPE html>
<html lang="fr">
    <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="fr"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Étudiants</title>
    <link href="../style/style.css" rel="stylesheet" type="text/css"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<script defer src="../javascript/students-bundle.js"></script></head>
<body>
    <header>
        <h1>Gestion des Étudiants</h1>
        <nav class="main-nav">
            <a href="/html/index.html">Accueil</a>
            <a href="/html/students.html" class="active">Gérer les étudiants</a>
            <a href="/html/groups.html">Gérer les groupes</a>
        </nav>
    </header>
    <main>
        <section class="student-management">
            <div class="create-zone">
                <h2>Ajouter un étudiant</h2>
                <div id="message"></div>
                <form id="student-form">
                    <input type="number" id="number" placeholder="Numéro étudiant" min="0" step="1" required />
                    <input type="text" id="name" placeholder="Nom" required />
                    <input type="text" id="firstnames" placeholder="Prénoms (séparés par des virgules)" required />
                    <div class="form-buttons">
                        <button id="createUpdate" type="button">Créer</button>
                        <button id="clear" type="button">Vider</button>
                    </div>
                </form>
            </div>
            <div class="student-list">
                <h2>Liste des étudiants</h2>
                <ul id="list"></ul>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2025 Gestion Étudiants - Tous droits réservés</p>
    </footer>
    <script src="../javascript/students.js"></script>
    
</body>
</html>
