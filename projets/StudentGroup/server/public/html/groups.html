<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Groupes</title>
    <link rel="stylesheet" href="../style/style.css">
<script defer src="../javascript/groups-bundle.js"></script></head>
<body>
    <header>
        <h1>Gestion des Groupes</h1>
        <nav>
            <a href="../html/index.html">Accueil</a>
            <a href="../html/students.html">Étudiants</a>
            <a href="#">Groupes</a>
        </nav>
    </header>
    <main>
        <section id="group-management">
            <h2>Attribution des groupes</h2>
            <div id="message"></div>
            
            <div id="group-container">
                <div id="group-sidebar">
                    <h3>Groupes</h3>
                    <ul id="group-list">
                        <li class="group-item" data-group="">Aucun groupe</li>
                        <li class="group-item" data-group="1">Groupe 1</li>
                        <li class="group-item" data-group="2">Groupe 2</li>
                        <li class="group-item" data-group="3">Groupe 3</li>
                        <li class="group-item" data-group="4">Groupe 4</li>
                        <li class="group-item" data-group="5">Groupe 5</li>
                        <li class="group-item" data-group="6">Groupe 6</li>
                    </ul>
                </div>

            <div id="student-list">
                <h3>Étudiants</h3>
                <ul id="students"></ul>
            </div>
        </section>
    </main>
    <script src="../javascript/groups.js"></script>
</body>
</html>
